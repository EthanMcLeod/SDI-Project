<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Town Geoportal</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Full-screen map setup */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-realtime/2.2.0/leaflet-realtime.min.js"></script>

    <script>
        // 1. Define the boundary for Cape Town (Southwest and Northeast corners)
        var capeTownBounds = L.latLngBounds(
            L.latLng(-34.36, 18.25), // Southern tip (Cape Point area)
            L.latLng(-33.45, 19.00)  // Northern/Eastern edge
        );

        // 2. Initialize the map with constraints
        var map = L.map('map', {
            center: [-33.99, 18.0], 
            zoom: 11,
            minZoom: 8,               
            maxBounds: capeTownBounds, 
            maxBoundsViscosity: 1.0    
        });

        // 3. Add the Base Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        map.fitBounds(capeTownBounds);

        // Setup the live moving bus asset
        var busIcon = L.icon({
            iconUrl: 'red-bus-icon.png', 
            iconSize: [16, 16]
        });

        var liveBusMarker = L.marker([-33.9249, 18.4241], { icon: busIcon })
            .bindPopup("<b>Live Bus</b><br>Status: In Transit")
            .addTo(map);

        // 4. Fetch Simulated Route Movement
        fetch('bus_route.geojson')
            .then(response => response.json())
            .then(geojsonData => {
                L.geoJSON(geojsonData, {
                    style: { color: '#bd1d00', weight: 5, opacity: 0.5 }
                }).addTo(map);

                var routeCoordinates = [];
                var geometry = geojsonData.features[0].geometry;

                if (geometry.type === 'LineString') {
                    routeCoordinates = geometry.coordinates;
                } else if (geometry.type === 'MultiLineString') {
                    routeCoordinates = geometry.coordinates.flat(1);
                }

                if (routeCoordinates.length === 0) {
                    console.error("No coordinates found in the GeoJSON file.");
                    return;
                }

                var currentIndex = 0;

                function moveBus() {
                    if (routeCoordinates.length === 0) return;

                    var currentPoint = routeCoordinates[currentIndex];
                    var lat = currentPoint[1];
                    var lng = currentPoint[0];

                    liveBusMarker.setLatLng([lat, lng]);
                    currentIndex = (currentIndex + 1) % routeCoordinates.length;
                }

                moveBus();
                setInterval(moveBus, 3000);
            })
            .catch(error => {
                console.error('Error loading your route GeoJSON file:', error);
            });

        // 5. Fetch MyCiTi Bus Routes Layer
        fetch('MyCiTi_Bus_Routes.geojson')
            .then(response => response.json())
            .then(geojsonData => {
                // FIXED: Explicitly defined routeLayer variable
                let routeLayer = L.geoJSON(geojsonData, {
                    style: { color: '#bd1d00', weight: 5, opacity: 0.5, interactive: true },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && Object.keys(feature.properties).length > 0) {
                            let routeName   = feature.properties.RT_NAME || "Unknown Route";
                            let routeStatus = feature.properties.RT_STS  || "Unknown Status";
                            let routeType   = feature.properties.RT_TYPE || "Unknown Route Type";
                            let routeNum    = feature.properties.RT_NMBR || "Unknown Route Number";

                            let popupContent = "<h3>MyCiTi Bus Route</h3>" +
                                               "<p><b>Route Name:</b> " + routeName + "</p>" +
                                               "<p><b>Route Status:</b> " + routeStatus + "</p>" +
                                               "<p><b>Route Type:</b> " + routeType + "</p>" +
                                               "<p><b>Route Number:</b> " + routeNum + "</p>";

                            layer.bindPopup(popupContent);
                        } else {
                            layer.bindPopup("<b>MyCiTi Route Layer Clicked!</b><br><i>No attributes found.</i>");
                        }
                    }
                }).addTo(map); // FIXED: Brackets realigned cleanly here

                routeLayer.bringToFront();
            })
            .catch(error => {
                console.error('Error loading your route GeoJSON file:', error);
            });    

        // 6. Fetch MyCiTi Bus Stops Layer
        fetch('MyCiTi_Bus_Stops.geojson') 
            .then(response => response.json())
            .then(geojsonData => {
                // FIXED: Explicitly defined stopsLayer variable so bringToFront works below
                let stopsLayer = L.geoJSON(geojsonData, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 5,         
                            fillColor: '#ffffff', 
                            color: '#0052cc',     
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && Object.keys(feature.properties).length > 0) {
                            let stopName   = feature.properties.STOP_NAME || "Unknown Stop";
                            let stopType   = feature.properties.STOP_TYPE || "Unknown Type";
                            let stopStatus = feature.properties.STOP_STS  || "Unknown Status";
                            let stopDesc   = feature.properties.STOP_DSCR || "No description available.";

                            let popupContent = "<h3>MyCiTi Bus Stop</h3>" +
                                               "<p><b>Name:</b> " + stopName + "</p>" +
                                               "<p><b>Type:</b> " + stopType + "</p>" +
                                               "<p><b>Status:</b> " + stopStatus + "</p>" +
                                               "<p><b>Description:</b> " + stopDesc + "</p>";

                            layer.bindPopup(popupContent);
                        } else {
                            layer.bindPopup("<b>MyCiTi Bus Stop</b><br><i>No data attributes found.</i>");
                        }
                    }
                }).addTo(map);

                stopsLayer.bringToFront();
            })
            .catch(error => {
                console.error('Error loading your stops GeoJSON file:', error);
            });
    </script>
</body>
</html>
