<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Town Geoportal</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Full-screen map setup */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-realtime/2.2.0/leaflet-realtime.min.js"></script>

    <script>
        // 1. Define the boundary for Cape Town (Southwest and Northeast corners)
        // These coordinates roughly cover the Metropolitan area
        var capeTownBounds = L.latLngBounds(
            L.latLng(-34.36, 18.25), // Southern tip (Cape Point area)
            L.latLng(-33.45, 19.00)  // Northern/Eastern edge (near Atlantis/Paarl border)
        );

        // 2. Initialize the map with constraints
        var map = L.map('map', {
            center: [-33.99, 18.0], // Center on City Bowl [cite: 10]
            zoom: 11,
            minZoom: 8,               // Prevent zooming out too far
            maxBounds: capeTownBounds, // Restrict panning area
            maxBoundsViscosity: 1.0    // Makes the boundary "hard" (bounces back)
        });

        // 3. Add the Base Layer [cite: 12]
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Optional: Ensure the map starts within the bounds
        map.fitBounds(capeTownBounds);

        // Layer groups:


        /*
            The red bus route and live tracking of the bus.
        */
        // This is just a command inside your script setting up the PNG image
        var busIcon = L.icon({
            iconUrl: 'red-bus-icon.png', 
            iconSize: [16, 16]
        });

        // 4. Create an empty, placeholder marker using your bus icon
        var liveBusMarker = L.marker([-33.9249, 18.4241], { icon: busIcon })
            .bindPopup("<b>Live Bus</b><br>Status: In Transit")
            .addTo(map);

        // 5. Fetch your QGIS Route Line string and simulate movement along its vertices
        fetch('bus_route.geojson')
            .then(response => response.json())
            .then(geojsonData => {
                // Draw the static route line on the map for visual reference
                L.geoJSON(geojsonData, {
                    style: { color: '#bd1d00', weight: 5, opacity: 0.5 }
                }).addTo(map);

                // Extract the coordinate coordinates array from your GeoJSON line layer
                // Note: GeoJSON stores positions as [Longitude, Latitude]
                var routeCoordinates = []
                var geometry = geojsonData.features[0].geometry;

                if (geometry.type === 'LineString') {
                    routeCoordinates = geometry.coordinates;
                } else if (geometry.type === 'MultiLineString') {
                    // Combine nested arrays into one continuous array
                    routeCoordinates = geometry.coordinates.flat(1);
                }

                if (routeCoordinates.length === 0) {
                    console.error("No coordinates found in the GeoJSON file.");
                    return;
                }

                var currentIndex = 0;

                // Function that updates the marker position to the next coordinate point
                function moveBus() {
                    if (routeCoordinates.length === 0) return;

                    var currentPoint = routeCoordinates[currentIndex];
                    
                    // Leaflet requires coordinates in [Latitude, Longitude] format (reversed from GeoJSON)
                    //var latLng = [currentPoint[1], currentPoint[2] || currentPoint[1]]; 
                    var lat = currentPoint[1];
                    var lng = currentPoint[0];

                    // Teleport the bus marker to the current step coordinate
                    liveBusMarker.setLatLng([lat, lng]);

                    // Update index to the next coordinate point (loops back to 0 when it hits the end)
                    currentIndex = (currentIndex + 1) % routeCoordinates.length;
                }

                // Run the position step once immediately
                moveBus();

                // 6. Automatically advance the bus position step every 1.5 seconds (1500ms)
                setInterval(moveBus, 3000);
            })
            .catch(error => {
                console.error('Error loading your route GeoJSON file:', error);
            });


        /*
            The MyCIti bus
        */

        // MyCiti routes info.
        // Get the routes and add the attributes when clicked.
        var activeBuses = []

        // Fetch your multi-route MyCiti GeoJSON file
        fetch('MyCiTi_Bus_Routes.geojson')
            .then(response => response.json())
            .then(geojsonData => {
                
                // Draw ALL 92 static route lines on the map for visual reference
                L.geoJSON(geojsonData, {
                    style: function(feature){ 
                        var routeIdentifier = String(feature.properties.RT_NMBR || "");

                        //var routeColour = '#ff7800';

                        var routeColoursMap = {
                            // 100s Series
                            '101': '#e31a1c',
                            '102': '#1f78b4',
                            '103': '#ffaa00',
                            '104': '#00e6c3',
                            '105': '#33a02c',
                            '106': '#b2df8a',
                            '107': '#fb9a99',
                            '108': '#fdbf6f',
                            '109': '#ff7f00',
                            '111': '#cab2d6',
                            '113': '#6a3d9a',
                            '114': '#b15928',
                            '115': '#a6cee3',
                            '118': '#290629',

                            // 200s Series
                            '213': '#543005',
                            '214a': '#8c510a',
                            '214b': '#bf812d',
                            '214c': '#dfc27d',
                            '215': '#80cdc1',
                            '216': '#35978f',
                            '217': '#01665e',
                            '223': '#003c30',
                            '231': '#4d4d4d',
                            '232': '#9e0142',
                            '233': '#d53e4f',
                            '234': '#f46d43',
                            '235': '#fdae61',
                            '236': '#e6f598',
                            '237': '#abdda4',
                            '244': '#66c2a5',
                            '245': '#3288bd',
                            '246': '#5e4fa2',
                            '260': '#762a83',
                            '261': '#9970ab',
                            '262': '#c2a5cf',

                            // Airport & District Routes
                            'A01': '#ff007f',
                            'D01': '#1a9850',
                            'D02': '#66bd63',
                            'D03': '#a6d96a',
                            'D04': '#fee08b',
                            'D05': '#fdae61',
                            'D08': '#f46d43',

                            // Trunk Routes
                            'T01': '#053061',
                            'T01X': '#2166ac',
                            'T02': '#4393c3',
                            'T02x': '#92c5de',
                            'T03': '#b2182b',
                            'T04': '#67001f'

                        };

                        // Grab matching color from map, otherwise use default gray
                        var selectedColour = routeColoursMap[routeIdentifier] || '#E3DB14';
                        
                        return {
                            color: selectedColour,
                            weight: 3,
                            opacity: 0.6
                        };
                    },

                    // --- ADDED INTERACTIVE POPUPS FOR THE ROUTE LINES ---
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && Object.keys(feature.properties).length > 0) {
                            // Safely read properties using fallbacks in case QGIS truncated the names
                            let routeName   = feature.properties.RT_NAME   || feature.properties.name       || "Unknown Route";
                            let routeStatus = feature.properties.RT_STS    || feature.properties.status     || "Unknown Status";
                            let routeType   = feature.properties.RT_TYPE   || feature.properties.type       || "Unknown Route Type";
                            let routeNum    = feature.properties.RT_NMBR   || feature.properties.ROUTE_NUM  || "Unknown Number";

                            // Build the HTML layout for your popup bubble
                            let popupContent = "<h3>MyCiTi Bus Route</h3>" +
                                               "<p><b>Route Number:</b> " + routeNum + "</p>" +
                                               "<p><b>Route Name:</b> " + routeName + "</p>" +
                                               "<p><b>Route Type:</b> " + routeType + "</p>" +
                                               "<p><b>Route Status:</b> " + routeStatus + "</p>";

                            // Bind it to the clicked line
                            layer.bindPopup(popupContent);
                        } else {
                            // Fallback case if a line completely lacks attributes
                            layer.bindPopup("<b>MyCiTi Route Layer Clicked!</b><br><i>No attributes found.</i>");
                        }
                    }
                }).addTo(map);

                // Loop through every individual route feature in the GeoJSON file
                geojsonData.features.forEach((feature, featureIndex) => {
                    
                    // Extract the coordinate array for this specific route
                    var coordinates = [];
                    
                    // Safe flattening in case QGIS exported them as LineString or MultiLineString
                    if (feature.geometry.type === "LineString") {
                        coordinates = feature.geometry.coordinates;
                    } else if (feature.geometry.type === "MultiLineString") {
                        coordinates = feature.geometry.coordinates.flat(1);
                    }

                    // Skip if the route feature has no valid coordinate data
                    if (!coordinates || coordinates.length === 0) return;

                    // Use the route's name from attributes, or fallback to a generic number
                    var routeName = feature.properties.name || feature.properties.ROUTE_NUM || "Route " + (featureIndex + 1);

                    // Get the starting coordinate [Lng, Lat] and convert to Leaflet's [Lat, Lng]
                    var startPoint = coordinates[0];
                    var startLatLng = [startPoint[1], startPoint[0]];

                    // Create a unique, dedicated marker for this specific bus route
                    var busMarker = L.marker(startLatLng, { icon: busIcon })
                        .bindPopup("<b>Bus Route:</b> " + routeName + "<br><b>Status:</b> In Transit")
                        .addTo(map);

                    // Push this bus's independent state tracking object into our array
                    activeBuses.push({
                        marker: busMarker,
                        routeCoords: coordinates,
                        currentIndex: 0,
                        isWaiting: 0
                    });
                });

                // Define specific stop indices if you want them to pause (Optional)
                // Key: Vertex index, Value: Number of 1.5s cycles to wait
                var busStops = {
                    0: 10 // All 92 buses will pause at their starting terminal (index 0) for 15 seconds
                };

                // Core animation function that updates ALL 92 markers at once
                function moveAllBuses() {
                    activeBuses.forEach((bus) => {
                        // If this specific bus is resting at a stop, count down and skip movement
                        if (bus.isWaiting > 0) {
                            bus.isWaiting--;
                            return; 
                        }

                        // Extract current point data [Longitude, Latitude]
                        var currentPoint = bus.routeCoords[bus.currentIndex];
                        var lat = currentPoint[1];
                        var lng = currentPoint[0];

                        // Move this bus's physical marker on the map canvas
                        bus.marker.setLatLng([lat, lng]);

                        // Check if the current vertex matches a designated bus stop pause rule
                        if (busStops[bus.currentIndex] !== undefined) {
                            bus.isWaiting = busStops[bus.currentIndex];
                        }

                        // Advance this bus's index counter independently (loops back to 0 at its own route end)
                        bus.currentIndex = (bus.currentIndex + 1) % bus.routeCoords.length;
                    });
                }

                // Run the master movement function once immediately
                moveAllBuses();

                // Automatically advance all 92 buses every 1.5 seconds
                setInterval(moveAllBuses, 1500);

            })
            .catch(error => {
                console.error('Error loading your MyCiti GeoJSON file:', error);
            });  

        

        // MyCiti bus stops.
        // Create an empty layer container to hold your bus stops
        var busStopsToggleLayer = L.layerGroup();

        // OPTIONAL: If you want the bus stops to be ticked/visible by default on page load:
        busStopsToggleLayer.addTo(map);

        // Define your option menu content (The checkbox label mapping)
        var overlayLayers = {
            "Show MyCiTi Bus Stops": busStopsToggleLayer
        };

        // Add the native control/option box to the top right of the map
        L.control.layers(null, overlayLayers, { collapsed: false }).addTo(map);

        fetch('MyCiTi_Bus_Stops.geojson') 
        .then(response => response.json())
        .then(geojsonData => {
            let stopsLayer = L.geoJSON(geojsonData, {
                // Convert point coordinates into clean blue circle markers
                pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 5,         // Size of the dot
                        fillColor: '#ffffff', // White center
                        color: '#0052cc',     // A crisp, clear blue border
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                // Binds a popup window to every single bus stop dot
                onEachFeature: function (feature, layer) {

                    if (feature.properties && Object.keys(feature.properties).length > 0) {
                        // Extracting the specific attributes you provided
                        let stopName  = feature.properties.STOP_NAME || "Unknown Stop";
                        let stopType  = feature.properties.STOP_TYPE || "Unknown Type";
                        let stopStatus = feature.properties.STOP_STS  || "Unknown Status";
                        let stopDesc   = feature.properties.STOP_DSCR || "No description available.";

                        // Build a clean HTML layout for the stop popup
                        let popupContent = "<h3>MyCiTi Bus Stop</h3>" +
                                        "<p><b>Name:</b> " + stopName + "</p>" +
                                        "<p><b>Type:</b> " + stopType + "</p>" +
                                        "<p><b>Status:</b> " + stopStatus + "</p>" +
                                        "<p><b>Description:</b> " + stopDesc + "</p>";

                        layer.bindPopup(popupContent);
                    } else {
                        layer.bindPopup("<b>MyCiTi Bus Stop</b><br><i>No data attributes found.</i>");
                    }

                }
            }).addTo(map);

            stopsLayer.addTo(busStopsToggleLayer)
            stopsLayer.bringToFront();

        })
        .catch(error => {
            console.error('Error loading your stops GeoJSON file:', error);
        });

    </script>
</body>
</html>
