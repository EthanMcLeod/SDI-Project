<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Town Geoportal</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Full-screen map setup */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-realtime/2.2.0/leaflet-realtime.min.js"></script>

    <script>
        // 1. Define the boundary for Cape Town (Southwest and Northeast corners)
        // These coordinates roughly cover the Metropolitan area
        var capeTownBounds = L.latLngBounds(
            L.latLng(-34.36, 18.25), // Southern tip (Cape Point area)
            L.latLng(-33.45, 19.00)  // Northern/Eastern edge (near Atlantis/Paarl border)
        );

        // 2. Initialize the map with constraints
        var map = L.map('map', {
            center: [-33.99, 18.0], // Center on City Bowl [cite: 10]
            zoom: 11,
            minZoom: 8,               // Prevent zooming out too far
            maxBounds: capeTownBounds, // Restrict panning area
            maxBoundsViscosity: 1.0    // Makes the boundary "hard" (bounces back)
        });

        // 3. Add the Base Layer [cite: 12]
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Optional: Ensure the map starts within the bounds
        map.fitBounds(capeTownBounds);

        // This is just a command inside your script setting up the PNG image
        var busIcon = L.icon({
            iconUrl: 'red-bus-icon.png', 
            iconSize: [16, 16]
        });

        // 4. Create an empty, placeholder marker using your bus icon
        var liveBusMarker = L.marker([-33.9249, 18.4241], { icon: busIcon })
            .bindPopup("<b>Live Bus</b><br>Status: In Transit")
            .addTo(map);

        // 5. Fetch your QGIS Route Line string and simulate movement along its vertices
        fetch('bus_route.geojson')
            .then(response => response.json())
            .then(geojsonData => {
                // Draw the static route line on the map for visual reference
                L.geoJSON(geojsonData, {
                    style: { color: '#ff2700', weight: 5, opacity: 0.5 }
                }).addTo(map);

                // Extract the coordinate coordinates array from your GeoJSON line layer
                // Note: GeoJSON stores positions as [Longitude, Latitude]
                var routeCoordinates = []
                var geometry = geojsonData.features[0].geometry;

                if (geometry.type === 'LineString') {
                    routeCoordinates = geometry.coordinates;
                } else if (geometry.type === 'MultiLineString') {
                    // Combine nested arrays into one continuous array
                    routeCoordinates = geometry.coordinates.flat(1);
                }

                if (routeCoordinates.length === 0) {
                    console.error("No coordinates found in the GeoJSON file.");
                    return;
                }

                var currentIndex = 0;

                // Function that updates the marker position to the next coordinate point
                function moveBus() {
                    if (routeCoordinates.length === 0) return;

                    var currentPoint = routeCoordinates[currentIndex];
                    
                    // Leaflet requires coordinates in [Latitude, Longitude] format (reversed from GeoJSON)
                    //var latLng = [currentPoint[1], currentPoint[2] || currentPoint[1]]; 
                    var lat = currentPoint[1];
                    var lng = currentPoint[0];

                    // Teleport the bus marker to the current step coordinate
                    liveBusMarker.setLatLng([lat, lng]);

                    // Update index to the next coordinate point (loops back to 0 when it hits the end)
                    currentIndex = (currentIndex + 1) % routeCoordinates.length;
                }

                // Run the position step once immediately
                moveBus();

                // 6. Automatically advance the bus position step every 1.5 seconds (1500ms)
                setInterval(moveBus, 3000);
            })
            .catch(error => {
                console.error('Error loading your route GeoJSON file:', error);
            });
    </script>
</body>
</html>
